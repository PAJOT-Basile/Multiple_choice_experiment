name: Environments
########################  Dependencies  ###############################
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - fastqc = 0.12.1
  - multiqc = 1.13
  - fastp = 0.23.1
  - samtools = 1.15.1
  - bwa = 0.7.17
  - bcftools = 1.16
  - vcftools = 0.1.16
  - stacks = 2.65
  # R and R packages
  - r = 4.3.1
  - r-pacman
  - r-tidyverse = 2.0.0
  - r-argparse
  - r-ggpubr = 0.6.0
